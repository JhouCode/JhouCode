<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="Jhonatan Viana — Infraestrutura · Automação · Sistemas resilientes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#07090f"/>
    </linearGradient>
    <linearGradient id="alertLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0"/>
      <stop offset="18%" stop-color="#fb7185" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#fb7185" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="calmLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="alertArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="calmArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#1a2030" fill-opacity="0.7"/>
    </pattern>
    <linearGradient id="monoStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="360" rx="14" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="14" fill="url(#dots)"/>
  <rect width="1280" height="360" rx="14" fill="url(#glow)"/>

  <!-- terminal chrome -->
  <rect x="0" y="0" width="1280" height="36" rx="14" fill="#0d121c"/>
  <rect x="0" y="22" width="1280" height="14" fill="#0d121c"/>
  <line x1="0" y1="36" x2="1280" y2="36" stroke="#1a2030" stroke-width="1"/>
  <circle cx="22" cy="18" r="5.5" fill="#fb7185" fill-opacity="0.85"/>
  <circle cx="42" cy="18" r="5.5" fill="#fbbf24" fill-opacity="0.85"/>
  <circle cx="62" cy="18" r="5.5" fill="#34d399" fill-opacity="0.85"/>
  <text x="640" y="23" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#5b6478">jhou@wow-server: ~</text>
  <text x="1252" y="23" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#3a4253">v.2026.05</text>

  <!-- threshold -->
  <line x1="56" y1="288" x2="1224" y2="288" stroke="#fb7185" stroke-opacity="0.18" stroke-dasharray="3 5" stroke-width="0.8"/>
  <text x="60" y="284" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#3a4253" letter-spacing="0.5">SATURATION</text>

  <!-- ÁREA — caos (jagged dense) -->
  <path d="M 56,300
           L 70,300 L 80,295 L 90,304 L 100,290 L 110,303 L 120,298 L 130,305 L 140,294 L 150,302 L 160,288 L 170,303 L 180,297 L 190,304 L 200,291 L 210,303 L 220,298 L 230,304 L 240,293 L 250,302 L 260,290 L 270,304 L 280,297 L 290,303 L 300,294 L 310,303 L 320,291 L 330,302 L 340,297 L 350,303 L 360,294 L 370,302 L 380,290 L 390,303 L 400,297 L 410,302 L 420,295 L 430,301 L 440,298 L 450,300
           L 1224,300 L 1224,360 L 56,360 Z"
        fill="url(#alertArea)"/>

  <!-- ÁREA — calmaria -->
  <path d="M 450,300 L 500,299 L 560,300 L 620,299.5 L 680,300 L 740,299 L 800,299.5 L 860,300 L 920,299 L 980,300 L 1040,299.5 L 1100,300 L 1160,299 L 1224,299.5
           L 1224,360 L 450,360 Z"
        fill="url(#calmArea)"/>

  <!-- LINHA caos -->
  <path d="M 56,300 L 70,300 L 80,295 L 90,304 L 100,290 L 110,303 L 120,298 L 130,305 L 140,294 L 150,302 L 160,288 L 170,303 L 180,297 L 190,304 L 200,291 L 210,303 L 220,298 L 230,304 L 240,293 L 250,302 L 260,290 L 270,304 L 280,297 L 290,303 L 300,294 L 310,303 L 320,291 L 330,302 L 340,297 L 350,303 L 360,294 L 370,302 L 380,290 L 390,303 L 400,297 L 410,302 L 420,295 L 430,301 L 440,298 L 450,300"
        fill="none" stroke="url(#alertLine)" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- LINHA calmaria -->
  <path d="M 450,300 L 500,299 L 560,300 L 620,299.5 L 680,300 L 740,299 L 800,299.5 L 860,300 L 920,299 L 980,300 L 1040,299.5 L 1100,300 L 1160,299 L 1224,299.5"
        fill="none" stroke="url(#calmLine)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- monograma -->
  <g transform="translate(56, 80)">
    <rect x="0" y="0" width="52" height="52" rx="10" fill="#0c1018" stroke="url(#monoStroke)" stroke-width="1"/>
    <rect x="0" y="0" width="52" height="52" rx="10" fill="none" stroke="#7dd3fc" stroke-opacity="0.05" stroke-width="3"/>
    <text x="26" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="22" fill="#bae6fd" letter-spacing="-0.5">JV</text>
    <circle cx="46" cy="6" r="2.5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- prompt -->
  <text x="128" y="100" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#7dd3fc">~/jhou</text>
  <text x="172" y="100" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#5b6478">$</text>
  <text x="184" y="100" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#9aa3b5">whoami --verbose</text>

  <!-- nome + tagline -->
  <text x="56" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="46" fill="#f6f8fc" letter-spacing="-0.8">Jhonatan Viana</text>
  <text x="56" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="17" fill="#7dd3fc" letter-spacing="0.5">Infraestrutura  ·  Automação  ·  Sistemas resilientes</text>

  <!-- divider -->
  <line x1="56" y1="226" x2="156" y2="226" stroke="#7dd3fc" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="160" y1="226" x2="220" y2="226" stroke="#1a2030" stroke-width="1"/>

  <!-- tagline pt + en -->
  <text x="56" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#9aa3b5">Engenharia operacional para sistemas que não podem parar.</text>
  <text x="56" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-style="italic" font-size="13" fill="#5b6478">Operational engineering for systems that can&apos;t go down.</text>

  <!-- status pill (canto sup. dir.) -->
  <g transform="translate(1064, 76)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#0c1018" stroke="#1a2030" stroke-width="1"/>
    <circle cx="18" cy="15" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="19" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#e9edf5" letter-spacing="0.5">JHOU TBC  ·  LIVE</text>
  </g>

  <!-- meta block direito -->
  <g transform="translate(1224, 132)" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text font-size="9" fill="#3a4253" letter-spacing="1.2">LOCATION</text>
    <text y="16" font-size="12" fill="#9aa3b5">cariacica · es · br</text>

    <text y="44" font-size="9" fill="#3a4253" letter-spacing="1.2">ROLE</text>
    <text y="60" font-size="12" fill="#9aa3b5">soluções de ti · pense rede</text>

    <text y="88" font-size="9" fill="#3a4253" letter-spacing="1.2">PROD SINCE</text>
    <text y="104" font-size="12" fill="#9aa3b5">2026-05-16</text>
  </g>

  <!-- footer signature -->
  <text x="56" y="340" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#3a4253" letter-spacing="1.2">// CARIACICA → INTERNET · SOLO OPS · BARE METAL</text>
  <text x="1224" y="340" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#3a4253" letter-spacing="1.2">jhou.tech</text>
</svg>
