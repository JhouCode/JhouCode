<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 310" role="img" aria-label="Jhonatan Viana — Infraestrutura · Automação · Sistemas resilientes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#07090f"/>
    </linearGradient>
    <!-- linha em alerta (caos) — fade nas pontas, igual jhou.tech -->
    <linearGradient id="alertLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fb7185" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#fb7185" stop-opacity="0.6"/>
      <stop offset="80%"  stop-color="#fb7185" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.85"/>
    </linearGradient>
    <!-- linha normal (calmaria) — fade pra direita -->
    <linearGradient id="calmLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="62%"  stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="95%"  stop-color="#7dd3fc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="alertArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="calmArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.55" fill="#1a2030" fill-opacity="0.6"/>
    </pattern>
    <!-- glow do radar (clona o drop-shadow do jhou.tech) -->
    <filter id="ringGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="310" rx="14" fill="url(#bg)"/>
  <rect width="1280" height="310" rx="14" fill="url(#dots)"/>
  <rect width="1280" height="310" rx="14" fill="url(#glow)"/>

  <!-- terminal chrome -->
  <rect x="0" y="0" width="1280" height="36" rx="14" fill="#0d121c"/>
  <rect x="0" y="22" width="1280" height="14" fill="#0d121c"/>
  <line x1="0" y1="36" x2="1280" y2="36" stroke="#1a2030" stroke-width="1"/>
  <circle cx="22" cy="18" r="5.5" fill="#fb7185" fill-opacity="0.85"/>
  <circle cx="42" cy="18" r="5.5" fill="#fbbf24" fill-opacity="0.85"/>
  <circle cx="62" cy="18" r="5.5" fill="#34d399" fill-opacity="0.85"/>
  <text x="640" y="23" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#5b6478">jhou@wow-server: ~</text>

  <!-- prompt -->
  <text x="56" y="82" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#7dd3fc">~/jhou</text>
  <text x="102" y="82" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#5b6478">$</text>
  <text x="116" y="82" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#9aa3b5">whoami</text>

  <!-- live pill (canto sup. dir.) -->
  <g transform="translate(1066, 64)">
    <rect x="0" y="0" width="158" height="30" rx="15" fill="#0c1018" stroke="#1a2030" stroke-width="1"/>
    <circle cx="18" cy="15" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="19" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#e9edf5" letter-spacing="0.5">JHOU TBC  ·  LIVE</text>
  </g>
  <text x="1224" y="114" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#3a4253" letter-spacing="0.6">prod desde mai/2026 · solo</text>

  <!-- nome + role -->
  <text x="56" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="48" fill="#f6f8fc" letter-spacing="-0.9">Jhonatan Viana</text>
  <text x="56" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="17" fill="#7dd3fc" letter-spacing="0.4">Infraestrutura  ·  Automação  ·  Sistemas resilientes</text>

  <!-- divider -->
  <line x1="56" y1="205" x2="150" y2="205" stroke="#7dd3fc" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="154" y1="205" x2="200" y2="205" stroke="#1a2030" stroke-width="1"/>

  <!-- positioning pt + en -->
  <text x="56" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#cdd4e0">Sistemas que não podem parar — do core em C++ ao edge, sozinho.</text>
  <text x="56" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-style="italic" font-size="12.5" fill="#5b6478">Systems that can&apos;t go down — C++ core to edge, solo.</text>

  <!-- ===== CHART DE ASSINATURA: caos -> jhou.in -> nominal ===== -->
  <!-- area caos -->
  <path d="M 56,272 L 64,276 L 72,269 L 80,277 L 88,271 L 96,265 L 104,276 L 112,271 L 120,277 L 128,270 L 136,276 L 144,266 L 152,277 L 160,271 L 168,276 L 176,269 L 184,277 L 192,267 L 200,276 L 208,271 L 216,277 L 224,270 L 232,276 L 240,265 L 248,277 L 256,271 L 264,276 L 272,270 L 280,277 L 288,268 L 296,276 L 304,271 L 312,277 L 320,270 L 328,276 L 336,266 L 344,277 L 352,271 L 360,276 L 368,270 L 376,277 L 384,268 L 392,276 L 400,272 L 408,275 L 414,278 L 420,281 L 426,283 L 430,285 L 430,300 L 56,300 Z"
        fill="url(#alertArea)"/>
  <!-- area calmaria -->
  <path d="M 430,285 L 480,285 L 540,284.5 L 600,285 L 670,284.5 L 740,285 L 810,284.5 L 880,285 L 960,284.5 L 1040,285 L 1120,284.5 L 1224,285 L 1224,300 L 430,300 Z"
        fill="url(#calmArea)"/>

  <!-- linha caos -->
  <path d="M 56,272 L 64,276 L 72,269 L 80,277 L 88,271 L 96,265 L 104,276 L 112,271 L 120,277 L 128,270 L 136,276 L 144,266 L 152,277 L 160,271 L 168,276 L 176,269 L 184,277 L 192,267 L 200,276 L 208,271 L 216,277 L 224,270 L 232,276 L 240,265 L 248,277 L 256,271 L 264,276 L 272,270 L 280,277 L 288,268 L 296,276 L 304,271 L 312,277 L 320,270 L 328,276 L 336,266 L 344,277 L 352,271 L 360,276 L 368,270 L 376,277 L 384,268 L 392,276 L 400,272 L 408,275 L 414,278 L 420,281 L 426,283 L 430,285"
        fill="none" stroke="url(#alertLine)" stroke-width="1.2" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- linha calmaria -->
  <path d="M 430,285 L 480,285 L 540,284.5 L 600,285 L 670,284.5 L 740,285 L 810,284.5 L 880,285 L 960,284.5 L 1040,285 L 1120,284.5 L 1224,285"
        fill="none" stroke="url(#calmLine)" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- nó jhou.in: radar ping (3 aneis escalonados) + ancora estatica -->
  <g filter="url(#ringGlow)">
    <!-- ring 1 -->
    <circle cx="430" cy="285" r="2" fill="none" stroke="#67e8f9" stroke-width="1.4" opacity="0">
      <animate attributeName="r" dur="3.6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" values="2;18" keySplines="0.2 0.55 0.4 1"/>
      <animate attributeName="opacity" dur="3.6s" begin="0s" repeatCount="indefinite" keyTimes="0;0.15;0.70;1" values="0;0.9;0.4;0"/>
    </circle>
    <!-- ring 2 (delay -1.2s) -->
    <circle cx="430" cy="285" r="2" fill="none" stroke="#67e8f9" stroke-width="1.4" opacity="0">
      <animate attributeName="r" dur="3.6s" begin="-1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" values="2;18" keySplines="0.2 0.55 0.4 1"/>
      <animate attributeName="opacity" dur="3.6s" begin="-1.2s" repeatCount="indefinite" keyTimes="0;0.15;0.70;1" values="0;0.9;0.4;0"/>
    </circle>
    <!-- ring 3 (delay -2.4s) -->
    <circle cx="430" cy="285" r="2" fill="none" stroke="#67e8f9" stroke-width="1.4" opacity="0">
      <animate attributeName="r" dur="3.6s" begin="-2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" values="2;18" keySplines="0.2 0.55 0.4 1"/>
      <animate attributeName="opacity" dur="3.6s" begin="-2.4s" repeatCount="indefinite" keyTimes="0;0.15;0.70;1" values="0;0.9;0.4;0"/>
    </circle>
  </g>
  <!-- ancora estatica jhou.in: tick + aneis fixos + ponto -->
  <g>
    <line x1="430" y1="266" x2="430" y2="285" stroke="#7dd3fc" stroke-width="0.6" opacity="0.45"/>
    <circle cx="430" cy="285" r="6" fill="none" stroke="#7dd3fc" stroke-width="0.5" opacity="0.25"/>
    <circle cx="430" cy="285" r="3.2" fill="none" stroke="#7dd3fc" stroke-width="0.7" opacity="0.6"/>
    <circle cx="430" cy="285" r="1.8" fill="#7dd3fc"/>
  </g>

  <!-- microlabels da narrativa -->
  <text x="56" y="303" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="0.5"><tspan fill="#fb7185" fill-opacity="0.7">//</tspan><tspan fill="#3a4253"> pré-jhou</tspan></text>
  <text x="430" y="303" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="0.5"><tspan fill="#7dd3fc" fill-opacity="0.7">▸</tspan><tspan fill="#5b6478"> jhou.in</tspan></text>
  <text x="1224" y="303" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="0.5"><tspan fill="#3a4253">// nominal</tspan></text>
</svg>
