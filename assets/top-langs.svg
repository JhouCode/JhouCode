<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-label="Top languages — distribuição de código no working tree">
  <defs>
    <style>
      .t  { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; fill: #7DD3FC; }
      .s  { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 9px;  fill: #3a4253; letter-spacing: 0.8px; }
      .l  { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #BAE6FD; }
      .p  { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #9aa3b5; }
    </style>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="519" height="199" rx="8" fill="#07090F" stroke="#1A2030" stroke-width="1"/>

  <!-- title -->
  <text class="t" x="16" y="24">top languages</text>
  <text class="s" x="16" y="40">// CODE DISTRIBUTION · JHOU TBC + PUBLIC REPOS</text>

  <!-- bar -->
  <!-- C++ 40 % -->
  <rect x="16"  y="56" width="200" height="14" fill="#F34B7D" fill-opacity="0.75"/>
  <!-- Python 25 % -->
  <rect x="216" y="56" width="125" height="14" fill="#3572A5"/>
  <!-- SQL 10 % -->
  <rect x="341" y="56" width="50"  height="14" fill="#E38C00" fill-opacity="0.85"/>
  <!-- HTML 8 % -->
  <rect x="391" y="56" width="40"  height="14" fill="#E34C26" fill-opacity="0.8"/>
  <!-- Bash 7 % -->
  <rect x="431" y="56" width="35"  height="14" fill="#89E051" fill-opacity="0.7"/>
  <!-- CSS 5 % -->
  <rect x="466" y="56" width="25"  height="14" fill="#663399" fill-opacity="0.85"/>
  <!-- JS 5 % -->
  <rect x="491" y="56" width="25"  height="14" fill="#F1E05A" fill-opacity="0.7"/>

  <!-- legenda — 2 colunas -->
  <!-- col 1 -->
  <g transform="translate(16, 90)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#F34B7D" fill-opacity="0.75"/>
    <text class="l" x="18" y="9">C++</text>
    <text class="p" x="220" y="9" text-anchor="end">40.0 %</text>
  </g>
  <g transform="translate(16, 108)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#3572A5"/>
    <text class="l" x="18" y="9">Python</text>
    <text class="p" x="220" y="9" text-anchor="end">25.0 %</text>
  </g>
  <g transform="translate(16, 126)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#E38C00" fill-opacity="0.85"/>
    <text class="l" x="18" y="9">SQL</text>
    <text class="p" x="220" y="9" text-anchor="end">10.0 %</text>
  </g>
  <g transform="translate(16, 144)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#E34C26" fill-opacity="0.8"/>
    <text class="l" x="18" y="9">HTML</text>
    <text class="p" x="220" y="9" text-anchor="end">8.0 %</text>
  </g>

  <!-- col 2 -->
  <g transform="translate(272, 90)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#89E051" fill-opacity="0.7"/>
    <text class="l" x="18" y="9">Bash</text>
    <text class="p" x="220" y="9" text-anchor="end">7.0 %</text>
  </g>
  <g transform="translate(272, 108)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#663399" fill-opacity="0.85"/>
    <text class="l" x="18" y="9">CSS</text>
    <text class="p" x="220" y="9" text-anchor="end">5.0 %</text>
  </g>
  <g transform="translate(272, 126)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#F1E05A" fill-opacity="0.7"/>
    <text class="l" x="18" y="9">JavaScript</text>
    <text class="p" x="220" y="9" text-anchor="end">5.0 %</text>
  </g>

  <!-- footer -->
  <line x1="16" y1="170" x2="504" y2="170" stroke="#1A2030" stroke-width="0.5"/>
  <text class="s" x="16"  y="185">// ESTIMATIVA SOBRE O WORKING TREE · NÃO USA GITHUB LINGUIST</text>
  <text class="s" x="504" y="185" text-anchor="end">jhou.tech</text>
</svg>
