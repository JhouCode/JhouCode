name: metrics

on:
  # roda 1x/dia às 04:00 UTC (01:00 em São Paulo)
  schedule:
    - cron: "0 4 * * *"
  # permite disparar manual via Actions tab
  workflow_dispatch:
  # re-gera quando o próprio workflow muda
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: gera github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # leitura ampla (inclui repo privado jhou-tbc-server)
          token: ${{ secrets.METRICS_TOKEN }}
          # GITHUB_TOKEN nativo pra commitar de volta neste repo
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: JhouCode
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          filename: github-metrics.svg

          # === escopo de repos ===
          repositories_affiliations: owner
          repositories_skipped: JhouCode/cursos

          # === identidades de commit ===
          # action filtra commits por autor. lista TODAS as identidades
          # que aparecem em git log (web GH, servidor, gmail antigo, etc.)
          commits_authoring: >-
            JhouCode,
            jhou@jhou.tech,
            jhonatan.pgd@gmail.com,
            JhouCode@users.noreply.github.com,
            users.noreply.github.com

          # === languages ===
          # indepth: yes → conta linhas autoradas via git log (NÃO bytes).
          # exclui automaticamente código de terceiros (venv do cursos,
          # libs commitadas) — só conta o que o Jhou escreveu.
          plugin_languages: yes
          plugin_languages_indepth: yes
          # força incluir repos que a auto-discovery pode estar perdendo
          plugin_languages_indepth_custom: JhouCode/jhou-tbc-server
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 20
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 365
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github
          # skip duplicado pra garantir
          plugin_languages_skipped: JhouCode/cursos
          # esconde lixo de venv commitada e linguagens irrelevantes
          plugin_languages_ignored: >-
            jupyter-notebook, cython, fortran, forth, smarty,
            meson, batchfile, roff, powershell, makefile
