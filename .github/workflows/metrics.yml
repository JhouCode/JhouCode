name: metrics

on:
  # roda 1x/dia às 04:00 UTC (01:00 em São Paulo)
  schedule:
    - cron: "0 4 * * *"
  # permite disparar manual via Actions tab
  workflow_dispatch:
  # re-gera quando o próprio workflow muda
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: gera github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # leitura ampla (inclui repo privado jhou-tbc-server)
          token: ${{ secrets.METRICS_TOKEN }}
          # GITHUB_TOKEN nativo pra commitar de volta neste repo
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: JhouCode
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          filename: github-metrics.svg

          # === escopo de repos ===
          # crítico: 'all' inclui privados (jhou-tbc-server)
          repositories_affiliations: owner
          repositories_skipped: JhouCode/cursos

          # === languages ===
          plugin_languages: yes
          # indepth: no → conta bytes via Linguist em todos os repos
          # (indepth só mexe nos últimos N commits → subrepresenta)
          plugin_languages_indepth: no
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github
          # esconde lixo de venv commitada e linguagens irrelevantes
          plugin_languages_ignored: >-
            jupyter-notebook, cython, fortran, forth, smarty,
            meson, batchfile, roff, powershell, makefile
